name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      # core/gonet builds its Go networking library with gomobile and the runner's Android NDK.
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/gonet/go/go.mod
          cache-dependency-path: core/gonet/go/go.sum
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Go vet
        working-directory: core/gonet/go
        run: go vet ./...
      - name: Go tests
        working-directory: core/gonet/go
        run: go test ./...
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "9.7.1" }
      # JVM unit tests: OAuth/MCP auth and protocol, the HTTP server end to end, and SSH/SFTP against an
      # in-process server. Instrumented tests (EncryptedConfigStore on a device) are not run here.
      - name: Unit tests
        run: set -o pipefail; gradle testDebugUnitTest --no-daemon 2>&1 | tee test.log
      - if: failure()
        run: |
          grep -E 'FAILED|tests completed|What went wrong' -A4 test.log | head -80 | sed 's/^/::error::/'
      - name: Signing key
        env: { KS: "${{ secrets.SIGNING_KEYSTORE }}" }
        run: |
          [ -n "$KS" ] || { echo "::error::Add SIGNING_KEYSTORE and SIGNING_PASSWORD repo secrets"; exit 1; }
          echo "$KS" | base64 -d > signing.jks
      - env: { SIGNING_PASSWORD: "${{ secrets.SIGNING_PASSWORD }}" }
        run: set -o pipefail; gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log
      - if: failure()
        run: |
          grep -E '^e: |What went wrong|Could not (find|resolve|GET)|Dependency .* requires|^> .*issues? (was|were) found' -A3 build.log | head -60 | sed 's/^/::error::/'
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
      # Fixed public link to the newest APK:
      # https://github.com/ehoeve786/SecureRemote/releases/download/latest/SecureRemote.apk
      - name: Publish APK
        if: github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/build/outputs/apk/debug/*.apk SecureRemote.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest build" --notes "Newest CI build."
          gh release upload latest SecureRemote.apk --clobber
