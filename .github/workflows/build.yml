name: build
on:
  push:
  pull_request:
  workflow_dispatch:
# Read-only by default. Only the publish job, which runs for main alone, may write to the repository.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      # core/gonet builds its Go networking library with gomobile and the runner's Android NDK.
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/gonet/go/go.mod
          cache-dependency-path: core/gonet/go/go.sum
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Go vet
        working-directory: core/gonet/go
        run: go vet ./...
      - name: Go tests
        working-directory: core/gonet/go
        run: go test ./...
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "9.7.1" }
      # JVM unit tests: OAuth/MCP auth and protocol, the HTTP server end to end, and SSH/SFTP against an
      # in-process server. Instrumented tests (EncryptedConfigStore on a device) are not run here.
      - name: Unit tests
        run: set -o pipefail; gradle testDebugUnitTest --no-daemon --continue 2>&1 | tee test.log
      - if: failure()
        run: |
          grep -E '^e: |FAILED|tests completed|What went wrong' -A2 test.log | head -40 | sed 's/^/::error::/'
      # The signing secrets reach only the push to main. Every other build (a branch, a pull request) compiles a
      # debug APK without them, so code on an unreviewed branch cannot read the release signing key.
      - name: Signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { KS: "${{ secrets.SIGNING_KEYSTORE }}" }
        run: |
          [ -n "$KS" ] || { echo "::error::Add SIGNING_KEYSTORE and SIGNING_PASSWORD repo secrets"; exit 1; }
          echo "$KS" | base64 -d > signing.jks
      - name: Release build (signed)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { SIGNING_PASSWORD: "${{ secrets.SIGNING_PASSWORD }}" }
        run: set -o pipefail; gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Debug build (no secrets)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: set -o pipefail; gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log
      - if: failure()
        run: |
          grep -E '^e: |What went wrong|Could not (find|resolve|GET)|Dependency .* requires|^> .*issues? (was|were) found' -A3 build.log | head -60 | sed 's/^/::error::/'
      - name: Upload release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

  # Publishes the main build under the fixed public "latest" link. The only job with write access, and it
  # runs no build code: it only takes the signed APK the build job produced.
  # https://github.com/ehoeve786/SecureRemote/releases/download/latest/SecureRemote.apk
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: app-release }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # Show what the artifact contained, then copy exactly one APK. Zero or several matches fail here
          # with a message, instead of letting cp fail with a generic error.
          ls -la
          apks=$(find . -maxdepth 1 -name '*.apk' -not -name SecureRemote.apk)
          count=$(printf '%s\n' "$apks" | grep -c .)
          [ "$count" -eq 1 ] || { echo "::error::expected one APK in the artifact, found $count"; exit 1; }
          cp "$apks" SecureRemote.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest build" --notes "Newest CI build."
          gh release upload latest SecureRemote.apk --clobber

  # Instrumented tests need an emulator: EncryptedConfigStore keeps its keys in the Android Keystore.
  instrumented:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "9.7.1" }
      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle :core:security:connectedDebugAndroidTest :core:terminal:connectedDebugAndroidTest --no-daemon --continue
            status=$?
            # Benchmark numbers are logged as BENCH lines; surface them as annotations on the run.
            "$ANDROID_HOME/platform-tools/adb" logcat -d -s TerminalBench:I | grep -o 'BENCH.*' | sed 's/^/::notice::/'
            exit $status
      - if: failure()
        run: |
          find . -path '*/build/outputs/androidTest-results/*' -name '*.xml' -exec grep -h -A3 '<failure' {} + | head -40 | sed 's/^/::error::/'
