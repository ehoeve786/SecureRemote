name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "8.14.3" }
      - name: Signing key
        env: { KS: "${{ secrets.SIGNING_KEYSTORE }}" }
        run: |
          [ -n "$KS" ] || { echo "::error::Add SIGNING_KEYSTORE and SIGNING_PASSWORD repo secrets"; exit 1; }
          echo "$KS" | base64 -d > signing.jks
      - env: { SIGNING_PASSWORD: "${{ secrets.SIGNING_PASSWORD }}" }
        run: set -o pipefail; gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log
      - if: failure()
        run: |
          grep -E '^e: |What went wrong' -A2 build.log | head -40 | sed 's/^/::error::/'
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
